<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog API UI</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: auto; }
        .post { border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; }
        input[type="text"], textarea { width: 100%; padding: 8px; margin-bottom: 10px; }
        button { padding: 10px 15px; background-color: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Blog Posts</h1>

        <h2>Create New Post</h2>
        <form id="createPostForm">
            <input type="text" id="postTitle" placeholder="Title" required><br>
            <textarea id="postContent" placeholder="Content" rows="5" required></textarea><br>
            <input type="text" id="postCategory" placeholder="Category" required><br>
            <button type="submit">Create Post</button>
        </form>

        <hr>

        <h2>All Posts</h2>
        <div id="postsContainer">
            Loading posts...
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:3000/api/v1'; // Assuming your API runs on port 3000

        async function fetchPosts() {
            try {
                const response = await fetch(`${API_BASE_URL}/posts`);
                const data = await response.json();
                const postsContainer = document.getElementById('postsContainer');
                postsContainer.innerHTML = ''; // Clear previous posts

                if (data.length === 0) {
                    postsContainer.innerHTML = '<p>No posts found.</p>';
                    return;
                }

                data.forEach(post => {
                    const postDiv = document.createElement('div');
                    postDiv.classList.add('post');
                    postDiv.innerHTML = `
                        <h3>${post.title}</h3>
                        <p><strong>Category:</strong> ${post.category}</p>
                        <p>${post.content}</p>
                        <small>Created: ${new Date(post.createdAt).toLocaleDateString()}</small>
                    `;
                    postsContainer.appendChild(postDiv);
                });
            } catch (error) {
                console.error('Error fetching posts:', error);
                document.getElementById('postsContainer').innerHTML = '<p>Error loading posts.</p>';
            }
        }

        document.getElementById('createPostForm').addEventListener('submit', async (event) => {
            event.preventDefault();

            const title = document.getElementById('postTitle').value;
            const content = document.getElementById('postContent').value;
            const category = document.getElementById('postCategory').value;

            try {
                const response = await fetch(`${API_BASE_URL}/posts`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ title, content, category }),
                });

                const result = await response.json();
                if (response.ok) {
                    alert('Post created successfully!');
                    document.getElementById('createPostForm').reset();
                    fetchPosts(); // Refresh posts
                } else {
                    alert(`Error: ${result.message || 'Failed to create post'}`);
                }
            } catch (error) {
                console.error('Error creating post:', error);
                alert('An error occurred while creating the post.');
            }
        });

        // Fetch posts when the page loads
        document.addEventListener('DOMContentLoaded', fetchPosts);
    </script>
</body>
</html>
